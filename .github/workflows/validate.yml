name: validate

# Automatická kontrola každého PR do main a každého pushe do main:
# validní JSON, JSON Schema a všechny offline testy (scripts/ci_validate.py).
# Workflow nic neslučuje – o sloučení rozhoduje vlastník.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema==4.*"
      - run: python3 scripts/ci_validate.py
